[project]
name = "trading-journal"
version = "0.1.0"
description = "Crypto trading journal — track and analyse your trades"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "python-multipart>=0.0.6",
    "ccxt>=4.0",
    "apscheduler>=3.10",
    "openpyxl>=3.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
journal = "app.main:app"
