services:
  journal:
    build: .
    ports:
      # 127.0.0.1 = only this computer can open the journal
      - "127.0.0.1:8000:8000"
    volumes:
      - journal-data:/data
    environment:
      - SYNC_INTERVAL_HOURS=6
      - DEFAULT_QUOTE_CURRENCY=USDT
      - DEFAULT_PNL_METHOD=fifo
    restart: unless-stopped

volumes:
  journal-data:
    driver: local
