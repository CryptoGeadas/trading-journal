services:
  journal:
    build: .
    ports:
      # 127.0.0.1 = only this computer can open the journal
      - "127.0.0.1:8000:8000"
    volumes:
      - journal-data:/data
    # Settings from .env (if there is one); the lines below win over it.
    env_file:
      - path: .env
        required: false
    environment:
      - SYNC_INTERVAL_HOURS=6
    restart: unless-stopped

volumes:
  journal-data:
    driver: local
